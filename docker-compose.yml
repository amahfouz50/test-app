# =============================================================================
# docker-compose.yml — SHMS Test App
# Usage:
#   Build & Start : docker compose up -d --build
#   Logs          : docker compose logs -f
#   Stop          : docker compose down
# =============================================================================
name: test-app

services:

  # ---------------------------------------------------------------------------
  # test-app Service
  # ---------------------------------------------------------------------------
  test-app:
    image: test-app:latest
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shms-test-app

    # -------------------------------------------------------------------------
    # Port: host 7012 -> container 7012
    # -------------------------------------------------------------------------
    ports:
      - "7012:7012"

    # -------------------------------------------------------------------------
    # Environment
    # -------------------------------------------------------------------------
    environment:
      SPRING_PROFILES_ACTIVE: "docker"
      TZ: "Asia/Riyadh"
      JAVA_OPTS: "-Xmx512m -Xms128m"

    # -------------------------------------------------------------------------
    # Restart policy
    # -------------------------------------------------------------------------
    restart: unless-stopped

    # -------------------------------------------------------------------------
    # Health check
    # -------------------------------------------------------------------------
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7012/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

    # -------------------------------------------------------------------------
    # Resource limits
    # -------------------------------------------------------------------------
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 640M
        reservations:
          cpus: "0.25"
          memory: 128M

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

    # -------------------------------------------------------------------------
    # Network
    # -------------------------------------------------------------------------
    networks:
      - test_net

# =============================================================================
# Networks
# =============================================================================
networks:
  test_net:
    driver: bridge
    name: shms-test-network
